<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 13px; }
      .title { font-size: 15px; font-weight: 600; }
      .label { font-size: 11px; fill: #555; }
      .box { rx: 8; ry: 8; stroke-width: 1.5; }
      .arrow { stroke: #666; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .darrow { stroke: #888; stroke-width: 1.2; fill: none; stroke-dasharray: 4,3; marker-end: url(#arrowhead2); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
  </defs>

  <!-- Agent -->
  <rect x="240" y="20" width="160" height="50" class="box" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="320" y="40" text-anchor="middle" class="title" fill="#1e40af">LLM Agent</text>
  <text x="320" y="58" text-anchor="middle" class="label">意图生成 + 工具选择</text>

  <!-- Bidirectional arrows Agent &lt;-&gt; Harness -->
  <line x1="320" y1="70" x2="320" y2="130" class="arrow"/>
  <line x1="320" y1="130" x2="320" y2="70" class="arrow" marker-end="url(#arrowhead)" transform="rotate(180 320 100)"/>
  <text x="335" y="105" class="label">Function Call / MCP</text>

  <!-- Harness -->
  <rect x="180" y="130" width="280" height="160" class="box" fill="#ffedd5" stroke="#f97316"/>
  <text x="320" y="155" text-anchor="middle" class="title" fill="#9a3412">Harness（运行时）</text>

  <!-- Harness internals -->
  <rect x="200" y="170" width="110" height="50" class="box" fill="#fff7ed" stroke="#fdba74"/>
  <text x="255" y="190" text-anchor="middle" class="title" fill="#7c2d12" font-size="12">能力发现</text>
  <text x="255" y="208" text-anchor="middle" class="label">Discovery</text>

  <rect x="330" y="170" width="110" height="50" class="box" fill="#fff7ed" stroke="#fdba74"/>
  <text x="385" y="190" text-anchor="middle" class="title" fill="#7c2d12" font-size="12">上下文注入</text>
  <text x="385" y="208" text-anchor="middle" class="label">Context</text>

  <rect x="200" y="230" width="110" height="50" class="box" fill="#fff7ed" stroke="#fdba74"/>
  <text x="255" y="250" text-anchor="middle" class="title" fill="#7c2d12" font-size="12">执行沙箱</text>
  <text x="255" y="268" text-anchor="middle" class="label">Sandbox</text>

  <rect x="330" y="230" width="110" height="50" class="box" fill="#fff7ed" stroke="#fdba74"/>
  <text x="385" y="250" text-anchor="middle" class="title" fill="#7c2d12" font-size="12">结果回传</text>
  <text x="385" y="268" text-anchor="middle" class="label">Feedback</text>

  <!-- Harness &lt;-&gt; Env -->
  <line x1="260" y1="290" x2="140" y2="340" class="darrow"/>
  <line x1="140" y1="340" x2="260" y2="290" class="darrow" marker-end="url(#arrowhead2)" transform="rotate(205 200 315)"/>

  <line x1="320" y1="290" x2="320" y2="340" class="darrow"/>
  <line x1="320" y1="340" x2="320" y2="290" class="darrow" marker-end="url(#arrowhead2)" transform="rotate(180 320 315)"/>

  <line x1="380" y1="290" x2="500" y2="340" class="darrow"/>
  <line x1="500" y1="340" x2="380" y2="290" class="darrow" marker-end="url(#arrowhead2)" transform="rotate(155 440 315)"/>

  <!-- Env boxes -->
  <rect x="60" y="340" width="120" height="50" class="box" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="120" y="362" text-anchor="middle" class="title" fill="#374151">文件系统</text>
  <text x="120" y="378" text-anchor="middle" class="label">read / write</text>

  <rect x="260" y="340" width="120" height="50" class="box" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="320" y="362" text-anchor="middle" class="title" fill="#374151">Shell</text>
  <text x="320" y="378" text-anchor="middle" class="label">exec / git</text>

  <rect x="460" y="340" width="120" height="50" class="box" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="520" y="362" text-anchor="middle" class="title" fill="#374151">网络</text>
  <text x="520" y="378" text-anchor="middle" class="label">fetch / API</text>
</svg>